version: 2

models:

  - name: int_movie_financials
    description: "Movies with valid positive budget and revenue values, including derived profit and ROI metrics."
    columns:
      - name: movie_id
        tests:
          - not_null
          - unique

      - name: budget
        tests:
          - not_null

      - name: revenue
        tests:
          - not_null


  - name: int_movie_genres
    description: "Movie-genre bridge model with one row per movie and genre combination."
    columns:
      - name: movie_id
        tests:
          - not_null

      - name: genre_name
        tests:
          - not_null


  - name: int_movie_runtime_ratings
    description: "Movies with valid runtime and rating information, classified into short, medium, and long runtime groups."
    columns:
      - name: movie_id
        tests:
          - not_null
          - unique

      - name: runtime
        tests:
          - not_null

      - name: runtime_group
        tests:
          - not_null

      - name: vote_average
        tests:
          - not_null